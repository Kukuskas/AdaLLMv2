[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adallm"
version = "0.1.0"
description = "NVFP4 inference runtime for Ada Lovelace GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "flash-attn>=2.5.0",
  "huggingface-hub>=0.20.0",
  "numpy>=1.24.0",
  "pydantic>=2.0.0",
  "safetensors>=0.4.0",
  "torch>=2.9.1",
  "triton>=2.1.0",
  "tqdm>=4.66.0",
  "transformers>=4.40.0",
  "uvicorn>=0.27.0",
  "xxhash>=3.6.0"
]

[project.scripts]
adallm = "adallm.cli:main"

[project.optional-dependencies]
vllm = ["vllm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["adallm*"]
